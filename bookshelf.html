<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>3D Bookshelf (Full-Screen Details)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="navigation-menu.css">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">

  </head>

  <body>
    <!-- Navigation Menu -->
    <div class="navigation-menu" id="navigationMenu"></div>

    <div id="bookBars"></div>
    <!-- <div id="barDateDisplay"></div> -->
    <div id="hoverBarDate" class="barDateLabel"></div>
    <div id="activeBarDate" class="barDateLabel"></div>
    


    <div id="controls">
      <button id="scrollLeft" aria-label="Scroll left">⟵</button>
      <button id="scrollRight" aria-label="Scroll right">⟶</button>
    </div>

    <!-- Base shelf canvas -->
    <canvas id="bookCanvas" aria-label="Interactive 3D bookshelf"></canvas>

    <!-- <div id="header">
      <h1>Library of Futures</h1>
      <p>An archive of sci-fi films arranged by how far they imagined the future. Click on a movie to explore.</p>
    </div> -->

    <!-- Overlay canvas -->
    <canvas id="activeBookCanvas" aria-hidden="true"></canvas>

    <!-- Card overlay -->
    <div id="bookinfo" aria-hidden="true">
      <div class="card" role="dialog" aria-modal="true">

        <div class="breadcrumb">Library > Film</div>
        <button id="closeInfo" class="btn close">✕</button>

        <button id="cardPrev" class="btn cardNav">L</button>
        <button id="cardNext" class="btn cardNav">R</button>

        <div class="film-details">
          <div class="film-header">

            <div class="title-row">
              <h1 class="title" id="bookTitle">Title</h1>
              <div class="rating-badge" id="ratingBadge">7.6/10</div>
            </div>

            <div class="tags-row" id="pillContainer"></div>

            <p class="plot" id="bookBlurb">Blurb</p>

            <div class="film-info-grid">
              <div class="info-item">
                <div class="info-label">Director</div>
                <div class="info-value" id="director">Director</div>
              </div>

              <div class="info-item">
                <div class="info-label">Released</div>
                <div class="info-value" id="released">Year, Location</div>
              </div>
            </div>

            <div class="info-item">
              <div class="info-label">Depicted</div>
              <div class="info-value" id="depicted">Year, Location</div>
            </div>
          </div>

          <div class="motifs-section">
            <h2 class="motifs-title">Technological Motifs</h2>
            <p class="motifs-desc">Click a motif to explore its connection to other films.</p>
            <div class="motifs-container" id="motifsContainer"></div>
          </div>

          <div class="bottomBox">
            <div class="actions">
              <button class="btn back-btn" id="backToShelf">← Back to Library</button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script type="module" src="./bookshelf.js"></script>
    <script src="navigation-menu.js"></script>

    <!-- FOOTER LOGO -->
    <div id="footerLogo">
      <div class="footer-icon"></div>
      <span class="footer-text">LIBRARY OF FUTURES</span>
    </div>
    <div id="cursorCircle"></div>


  </body>
</html>
