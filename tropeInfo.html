<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Themes Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Cover footer - matching index.html design */

            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;

            flex-direction: row;
            align-items: center;

        </div>

    <script>

        document.getElementById('tropename').textContent = trope;
