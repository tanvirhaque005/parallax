<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Map Morph to Globe</title>
  <link rel="stylesheet" href="navigation-menu.css">
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      background: #0a1628;
    }
  /* Page Header */
    .page-header {
      position: fixed;
      top: 40px;
      left: 40px;
      z-index: 50;
    }
    
    .back-link {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #cccccc;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      transition: color 0.3s;
      text-transform: uppercase;
    }
    
    .back-link:hover {
      color: #ffffff;
    }
    
    .back-arrow {
      font-size: 20px;
    }

    /* Navigation Buttons */
    .nav-buttons {
      position: fixed;
      top: 50%;
      right: 40px;
      z-index: 50;
    }
    
    .nav-btn {
      background-color: #2a2a2a;
      border: 1px solid white;
      color: #cccccc;
      padding: 14px 28px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
      text-transform: uppercase;
    }
    
    .nav-btn:hover {
      background-color: #3a3a3a;
      border-color: #666666;
      color: #ffffff;
    }

    #instructions {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 12px 18px;
      border-radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #flightPathTooltip {
      position: absolute;
      background: rgba(0,0,0,0.9);
      color: white;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 1000;
      max-width: 280px;
    }
    .planet-label {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
      pointer-events: none;
      user-select: none;
      text-transform: capitalize;
    }
/* MAIN TIMELINE BAR */
#timelineBar {
  position: fixed;
  bottom: 175px;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  align-items: center;
  gap: 14px;

  background: none;
  padding: 0;
  border-radius: 0;

  color: white;
  font-family: 'Courier New', Courier, monospace;

  z-index: 100;
}

/* SMALL UPPER LABEL */
#timelineLabel {
  font-size: 12px;
  color: #666666;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
  margin-bottom: 6px;
}

/* CURRENT DECADE VALUE */
#decadeValue {
  font-size: 14px;
  font-weight: 600;
  color: #888;
  text-align: center;
  min-width: 60px;
}

/* TRACK — now a visible flat dark bar */
#timelineTrack {
  width: 420px;
  height: 10px;

  background: #333333;     /* <— brings back visible track */
  border-radius: 4px;

  position: relative;
  cursor: pointer;
}

/* DRAGGABLE HANDLE — visible circle again */
#timelineHandle {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);

  width: 18px;
  height: 18px;

  border-radius: 50%;
  background: #ffffff;

  cursor: grab;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);

  left: 0%;   /* JS updates this */
  transition: background 0.2s;
}

#timelineHandle:active {
  cursor: grabbing;
}

/* Optional: active state color */
#timelineHandle.active {
  background: #eaeaea;
}

/* Top-left horizontal bars — thicker + lower on the page */
#bookBars {
  position: fixed;
  bottom: 48px; 
  left: 24px;
  height: 60px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  z-index: 2;        /* ← VERY IMPORTANT */
  pointer-events: auto;   /* ← ensure clicks reach the bars */
}

#bookBars:hover {
  cursor: none;
}

.book-bar.hovered {
  background: rgba(255,255,255,1);
  opacity: 1;
}


#bookBars::before {
  content: "";
  position: absolute;
  inset: -20px 0;
  pointer-events: none;   /* ← FIX */
}




.book-bar {
  width: 4px;
  height: 28px;
  background: rgba(255, 255, 255, 0.45);
  border-radius: 2px;
  pointer-events: auto;
  transition:
    height 0.35s ease,
    transform 0.35s ease,
    opacity 0.25s ease,
    background 0.25s ease;
}

.book-bar.active {
  background: rgba(255, 255, 255, 1);
  /* transform: scale(1.15); */
}


#barDateDisplay {
  position: fixed;
  top: 90px;            /* adjust as you want */
  left: 24px;
  color: #ffffff;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  opacity: 0.85;
  letter-spacing: 1px;
  z-index: 999999;      /* always visible */
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.barDateLabel {
  position: fixed;
  color: #ffffff;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  letter-spacing: 1px;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -8px); /* centered above bar */
  z-index: 999999;
  transition: opacity 0.15s ease, top 0.1s ease, left 0.1s ease;
}

  </style>
</head>

<body>
  <!-- Page Header -->
  <div class="page-header">
    <a href="parallel.html" class="back-link">
      <span class="back-arrow">←</span>
      <span>Return to Timeline</span>
    </a>
  </div>

  <!-- Navigation Buttons -->
  <div class="nav-buttons">
    <a href="reflectionPage.html" class="nav-btn" id="nextBtn">Next →</a>
  </div>

  <!-- Navigation Menu -->
  <div class="navigation-menu" id="navigationMenu"></div>

  <div id="flightPathTooltip"></div>

  <div id="timelineBar">
    <div id="timelineLabel">Decade Filter</div>
    <div id="decadeValue">All</div>
    <div id="timelineTrack">
      <div id="timelineHandle"></div>
    </div>
  </div>

  <div id="bookBars"></div>
  <!-- <div id="barDateDisplay"></div> -->
  <div id="hoverBarDate" class="barDateLabel"></div>
  <div id="activeBarDate" class="barDateLabel"></div>


  <canvas id="mapCanvas" style="display:none;"></canvas>
  <canvas id="scene"></canvas>


  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/d3-geo-projection.v4.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="morph.js"></script>
  <script src="navigation-menu.js"></script>
  <div id="cursorCircle"></div>
  <link rel="stylesheet" href="cursor.css">
  <script src="cursor.js" defer></script>

</body>
</html>
