<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prediction Timeline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="navigation-menu.css">

  <style>
    :root {
      --bg: #0e0e0f;
      --panel-bg: #ffffff;
      --ink: #eeeeee;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    .page-header {
      position: fixed;
      top: 40px;
      left: 40px;
      z-index: 50;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #cccccc;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      transition: color 0.3s;
      text-transform: uppercase;
    }
    .back-link:hover { color: #ffffff; }
    .back-arrow { font-size: 20px; }

    .nav-buttons {
      position: fixed;
      top: 50%;
      right: 40px;
      z-index: 50;
    }
    .nav-btn {
      background-color: #2a2a2a;
      border: 1px solid white;
      color: #cccccc;
      padding: 14px 28px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.3s;
    }
    .nav-btn:hover {
      background-color: #3a3a3a;
      color: white;
      border-color: #666;
    }

    .stage {
      width: 100%;
      height: 100vh;
      display: flex;
    }

    .left-card {
      width: 320px;
      height: 360px;
      background: var(--panel-bg);
      color: #111;
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: absolute;
      left: 40px;
      top: 180px;
      z-index: 30;
    }
    .left-card h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .left-card .meta { font-size: 12px; color: #444; }
    .left-card .desc { font-size: 13px; line-height: 1.45; color: #222; }
    .left-card .img-boxes {
      margin-top: auto; display: flex; gap: 14px;
    }
    .left-card .img-boxes div {
      width: 100px; height: 100px;
      background: #e6e6e6; border-radius: 6px;
    }

    /* Axes and Lines */
    svg { width: 100%; height: 100%; }
    .axis text { fill: white; opacity: 0.35; font-size: 12px; }
    .axis line { stroke: rgba(255,255,255,0.25); }
    .axis-title { fill: white; opacity: 0.6; font-size: 13px; }

    .grid line { stroke: rgba(255,255,255,0.12); }

    .link { stroke: white; stroke-opacity: 0.9; }
    .halo { stroke: white; stroke-opacity: 0.1; stroke-width: 10; }

    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      background: #1c1c1c;
      color: white;
      border: 1px solid #555;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      transform: translate(-50%, calc(-100% - 14px));
    }

    /* Top-left horizontal bars — thicker + lower on the page */
#bookBars {
  position: fixed;
  bottom: 16px; 
  left: 24px;
  height: 60px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  z-index: 2;        /* ← VERY IMPORTANT */
  pointer-events: auto;   /* ← ensure clicks reach the bars */
}

#bookBars:hover {
  cursor: none;
}

.book-bar.hovered {
  background: rgba(255,255,255,1);
  opacity: 1;
}


#bookBars::before {
  content: "";
  position: absolute;
  inset: -20px 0;
  pointer-events: none;   /* ← FIX */
}




.book-bar {
  width: 4px;
  height: 28px;
  background: rgba(255, 255, 255, 0.45);
  border-radius: 2px;
  pointer-events: auto;
  transition:
    height 0.35s ease,
    transform 0.35s ease,
    opacity 0.25s ease,
    background 0.25s ease;
}

.book-bar.active {
  background: rgba(255, 255, 255, 1);
  /* transform: scale(1.15); */
}


#barDateDisplay {
  position: fixed;
  top: 90px;            /* adjust as you want */
  left: 24px;
  color: #ffffff;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  opacity: 0.85;
  letter-spacing: 1px;
  z-index: 999999;      /* always visible */
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.barDateLabel {
  position: fixed;
  color: #ffffff;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  letter-spacing: 1px;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -8px); /* centered above bar */
  z-index: 999999;
  transition: opacity 0.15s ease, top 0.1s ease, left 0.1s ease;
}

  </style>
</head>

<body>
  <!-- Navigation Menu -->
  <div class="navigation-menu" id="navigationMenu"></div>

  <!-- RETURN -->
  <div class="page-header">
    <a href="chordGraph.html" class="back-link">

    </a>
  </div>

  <div class="nav-buttons">

      In the 1990s they were experiencing or recovering from the war…

    <div class="img-boxes">
      <div></div>
      <div></div>
    </div>
  </div>

  <div id="window-label"
       style="
         position: fixed;

         font-family: 'Courier New', monospace;
         color: #ffffff;

         z-index: 200;
       ">
  </div>

  <div id="window-track"
       style="
         position: fixed;

         height: 24px;

       ">
    <div id="window-thumb"
         style="
           position: absolute;

           background: white;

           box-shadow: 0 2px 6px rgba(0,0,0,0.25);
         ">
    </div>
  </div> -->

  <div id="bookBars"></div>
  <!-- <div id="barDateDisplay"></div> -->
  <div id="hoverBarDate" class="barDateLabel"></div>

  <!-- SVG STAGE -->
  <div class="stage">
    <svg id="parallel"></svg>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
  <script type="module" src="parallel.js"></script>
  <script src="navigation-menu.js"></script>
  <div id="cursorCircle"></div>
  <link rel="stylesheet" href="cursor.css">

</html>
