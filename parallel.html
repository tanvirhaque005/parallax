  <style>
    :root {
      --bg: #0e0e0f;
      --panel-bg: #ffffff;
      --ink: #eeeeee;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    .page-header {
      position: fixed;
      top: 40px;
      left: 40px;
      z-index: 50;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #cccccc;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      transition: color 0.3s;
      text-transform: uppercase;
      position: fixed;
         bottom: 40px;
         right: 40px;
         z-index: 200;
    }
    .back-link:hover { color: #ffffff; }
    .back-arrow { font-size: 20px;
      }

    .nav-buttons {
      position: fixed;
      top: 50%;
      right: 40px;
      z-index: 50;
    }
    .nav-btn {
      background-color: #2a2a2a;
      border: 1px solid white;
      color: #cccccc;
      padding: 14px 28px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.3s;
    }
    .nav-btn:hover {
      background-color: #3a3a3a;
      color: white;
      border-color: #666;
    }

    .stage {
      width: 100%;
      height: 100vh;
      display: flex;
    }

    /* ===========================================
   LEFT CARD — Minimal Modern Style (screenshot)
   =========================================== */

.left-card {
  position: absolute;
  left: 72px;
  top: 220px;

  width: 260px;
  padding: 22px 20px;

  background: rgba(255,255,255,0.02);
  border: 2px solid rgba(208, 208, 208, 0.304);
  border-radius: 18px;

  backdrop-filter: blur(5px);
  color: rgba(255,255,255,0.92);

  display: flex;
  flex-direction: column;
  gap: 14px;

  font-family: 'Inter', sans-serif;
}


/* Year Range Title */
.left-card h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.5px;
}


/* Capsule label (e.g., "CONSERVATIVE FUTURES") */
.left-card .tag {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;

  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.6px;

  border: 1px solid rgba(255,255,255,0.45);
  color: rgba(255,255,255,0.90);
  background: rgba(255,255,255,0.02);

  align-self: flex-start;
}


/* Description text */
.left-card .desc {
  font-size: 13px;
  line-height: 1.45;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.2px;
}


/* Optional: images can stay small or subtle */
.left-card .img-boxes {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}

.left-card .img-boxes div {
  width: 70px;
  height: 70px;
  border-radius: 8px;
  background: rgba(255,255,255,0.12);
  background-size: cover;
  background-position: center;
}


    /* Axes and Lines */
    svg { width: 100%; height: 100%; }
    .axis text {
      fill: rgba(255,255,255,0.95);
      opacity: 1;                   /* ← fully visible */
      font-size: 13px;              /* ← slightly bigger */
      letter-spacing: 0.5px;        /* ← sharper monospace look */
      paint-order: stroke;
      stroke: rgba(0,0,0,0.45);     /* ← outline for dark background */
    }


    .axis line { stroke: rgba(255,255,255,0.25); }
    .axis-title { fill: white; opacity: 1;font-size: 15px; }

    .grid line { stroke: rgba(255,255,255,0.12); }

    .link { stroke-opacity: 0.9; }
    .halo { stroke-opacity: 0.1; stroke-width: 10; }

    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      background: #1c1c1c;
      color: white;
      border: 1px solid #555;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      transform: translate(-50%, calc(-100% - 14px));
    }

    /* Top-left horizontal bars — thicker + lower on the page */
#bookBars {
  position: fixed;
  bottom: 28px; 
  left: 64px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  z-index: 2;        /* ← VERY IMPORTANT */
  pointer-events: auto;   /* ← ensure clicks reach the bars */
}

#bookBars:hover {
  cursor: none;
}

.book-bar.hovered {
  background: rgba(255,255,255,1);
  opacity: 1;
}


#bookBars::before {
  content: "";
  position: absolute;
  inset: -20px 0;
  pointer-events: none;   /* ← FIX */
}




.book-bar {
  width: 4px;
  height:18px;
  background: rgba(255, 255, 255, 0.45);
  border-radius: 2px;
  pointer-events: auto;
  transition:
    height 0.35s ease,
    transform 0.35s ease,
    opacity 0.25s ease,
    background 0.25s ease;
}

.book-bar.active {
  background: rgba(255, 255, 255, 1);
  /* transform: scale(1.15); */
}


#barDateDisplay {
  position: fixed;
  top: 90px;            /* adjust as you want */
  left: 24px;
  color: #ffffff;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  opacity: 0.85;
  letter-spacing: 1px;
  z-index: 999999;      /* always visible */
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.barDateLabel {
  position: fixed;
  color: #ffffff;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  letter-spacing: 1px;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -8px); /* centered above bar */
  z-index: 999999;
  transition: opacity 0.15s ease, top 0.1s ease, left 0.1s ease;
}

  </style>
