<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prediction Timeline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="menu-component.css">

  <style>
    :root {
      --bg: #0e0e0f;
      --panel-bg: #ffffff;
      --ink: #eeeeee;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    .page-header {
      position: fixed;
      top: 40px;
      left: 40px;
      z-index: 50;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #cccccc;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      transition: color 0.3s;
      text-transform: uppercase;
    }
    .back-link:hover { color: #ffffff; }
    .back-arrow { font-size: 20px; }

    .nav-buttons {
      position: fixed;
      top: 50%;
      right: 40px;
      z-index: 50;
    }
    .nav-btn {
      background-color: #2a2a2a;
      border: 1px solid white;
      color: #cccccc;
      padding: 14px 28px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.3s;
    }
    .nav-btn:hover {
      background-color: #3a3a3a;
      color: white;
      border-color: #666;
    }

    .stage {
      width: 100%;
      height: 100vh;
      display: flex;
    }

    .left-card {
      width: 320px;
      height: 360px;
      background: var(--panel-bg);
      color: #111;
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: absolute;
      left: 40px;
      top: 180px;
      z-index: 30;
    }
    .left-card h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .left-card .meta { font-size: 12px; color: #444; }
    .left-card .desc { font-size: 13px; line-height: 1.45; color: #222; }
    .left-card .img-boxes {
      margin-top: auto; display: flex; gap: 14px;
    }
    .left-card .img-boxes div {
      width: 100px; height: 100px;
      background: #e6e6e6; border-radius: 6px;
    }

    /* Axes and Lines */
    svg { width: 100%; height: 100%; }
    .axis text { fill: white; opacity: 0.35; font-size: 12px; }
    .axis line { stroke: rgba(255,255,255,0.25); }
    .axis-title { fill: white; opacity: 0.6; font-size: 13px; }

    .grid line { stroke: rgba(255,255,255,0.12); }

    .link { stroke: white; stroke-opacity: 0.9; }
    .halo { stroke: white; stroke-opacity: 0.1; stroke-width: 10; }

    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      background: #1c1c1c;
      color: white;
      border: 1px solid #555;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      transform: translate(-50%, calc(-100% - 14px));
    }
  </style>
</head>

<body>

  <!-- MENU BUTTON -->
  <div class="top-nav">
    <button class="menu-button" id="menuButton">MENU</button>
  </div>

  <div class="menu-overlay" id="menuOverlay"></div>

  <div class="menu-sidebar" id="menuSidebar">
    <div class="menu-header">
      <button class="menu-close" id="menuClose">MENU</button>
    </div>
    <ul class="menu-items">
      <li><a href="aboutPage.html">0. ABOUT</a></li>
      <li><a href="index.html">1. Library</a></li>
      <li><a href="chordGraph.html">2. Technological Network</a></li>
      <li><a href="parallel.html">3. Prediction Timeline</a></li>
      <li><a href="morph.html">4. World Building</a></li>
      <li><a href="#">5. Reflection</a></li>
    </ul>
  </div>

  <!-- RETURN -->
  <div class="page-header">
    <a href="chordGraph.html" class="back-link">
      <span class="back-arrow">←</span>
      <span>Return to Network</span>
    </a>
  </div>

  <!-- NEXT -->
  <div class="nav-buttons">
    <a href="morph.html" class="nav-btn">Next →</a>
  </div>

  <!-- LEFT CARD -->
  <div class="left-card">
    <h2>50 Year Depiction</h2>
    <div class="meta">Released 2002</div>
    <div class="meta">Released 2054</div>
    <div class="desc">
      In the 1990s they were experiencing or recovering from the war…
    </div>
    <div class="img-boxes">
      <div></div>
      <div></div>
    </div>
  </div>

  <!-- WINDOW LABEL -->
  <div id="window-label"
       style="
         position: fixed;
         top: 80px;
         right: 40px;
         font-family: 'Courier New', monospace;
         color: #ffffff;
         font-size: 15px;
         opacity: 0.85;
         z-index: 200;
       ">
  </div>

  <!-- SCRUBBER -->
  <div id="window-track"
       style="
         position: fixed;
         top: 110px;
         right: 40px;
         width: 260px;
         height: 24px;
         background: #8f8f8f;
         border-radius: 12px;
         z-index: 300;
       ">
    <div id="window-thumb"
         style="
           position: absolute;
           left: 0px;
           top: -8px;
           width: 28px;
           height: 40px;
           background: white;
           border-radius: 6px;
           cursor: grab;
           box-shadow: 0 2px 6px rgba(0,0,0,0.25);
         ">
    </div>
  </div>

  <!-- SVG STAGE -->
  <div class="stage">
    <svg id="parallel"></svg>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
  <script type="module" src="parallel.js"></script>

  <script>
    /* MENU */
    const btn = document.getElementById('menuButton');
    const closeBtn = document.getElementById('menuClose');
    const side = document.getElementById('menuSidebar');
    const overlay = document.getElementById('menuOverlay');

    btn.onclick = () => { side.classList.add('active'); overlay.classList.add('active'); };
    closeBtn.onclick = overlay.onclick = () => { side.classList.remove('active'); overlay.classList.remove('active'); };
  </script>

</body>
</html>
